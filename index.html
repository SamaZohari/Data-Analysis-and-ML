<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Olympic Games Data Analysis</title>
  <style>
    body {
      background-color: #eaf1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 40px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    .chart-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 16px; max-width: 850px; width: 100%;
    }
    img { width: 100%; height: auto; border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <div class="chart-card"><img src="fig_gen.png" alt="Medals over Years"></div>
  <div class="chart-card"><img src="fig_top10.png" alt="Top 10 Countries"></div>
  <div class="chart-card"><img src="fig_SVK.png" alt="Medals by Sport"></div>
</body>
</html>
